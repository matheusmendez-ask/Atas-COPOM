services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: copom_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333" # REST API & Web UI Dashboard
      - "6334:6334" # gRPC API
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5

  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: copom_phoenix
    restart: unless-stopped
    ports:
      - "6006:6006" # Phoenix UI & OTLP Collector (HTTP)
      - "4317:4317" # OTLP gRPC collector
    environment:
      - PHOENIX_PORT=6006
      - PHOENIX_ENABLE_TELEMETRY=true
    volumes:
      - phoenix_data:/root/.phoenix
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:6006/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  qdrant_storage:
    name: copom_qdrant_storage
  phoenix_data:
    name: copom_phoenix_data
