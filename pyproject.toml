[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "copom-rag-lakehouse"
version = "0.1.0"
description = "Enterprise COPOM RAG Lakehouse & Data Observability Pipeline"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Data Engineering Team", email = "data-eng@example.com" }
]
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "requests>=2.31.0",
    "tenacity>=8.3.0",
    "beautifulsoup4>=4.12.0",
    "langchain-text-splitters>=0.2.0",
    "tiktoken>=0.7.0",
    # QdrantClient(check_compatibility=...) só existe a partir da 1.12.
    "qdrant-client>=1.12.0",
    "fastembed>=0.3.0",
    # O servidor Arize Phoenix roda como container (docker-compose), não como
    # biblioteca: aqui só precisamos do exportador OTLP/HTTP que fala com ele.
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-exporter-otlp-proto-http>=1.24.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
# Necessário apenas com EMBEDDING_PROVIDER=openai.
openai = [
    "openai>=1.30.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
    "pytest-cov>=5.0.0",
    # Faixa fechada: `ruff format` muda de comportamento entre minors e a CI
    # roda `--check`, então um minor novo quebraria o build sozinho.
    "ruff>=0.16.0,<0.17.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "data",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
]
